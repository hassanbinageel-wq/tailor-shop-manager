name: tailor_shop_manager
description: تطبيق احترافي لإدارة محل الخياطة الرجالية - خياطين، قصاصين، عاملين، مصروفات وتقارير.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # إدارة الحالة
  provider: ^6.1.2

  # قاعدة البيانات المحلية (يعمل بدون إنترنت)
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4

  # تقارير PDF والطباعة
  pdf: ^3.11.1
  printing: ^5.13.2

  # تصدير Excel
  excel: ^4.0.6

  # الرسوم البيانية
  fl_chart: ^0.69.0

  # الملفات والمشاركة
  share_plus: ^10.0.2
  file_picker: ^8.1.2
  image_picker: ^1.1.2

  # الإشعارات المحلية
  flutter_local_notifications: '>=17.2.3 <20.0.0'

  # تجزئة كلمة المرور
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
